<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Overlay — prototype : maintenir pour un relapse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@300;400;500;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Chivo',system-ui,sans-serif;background:#171513;color:#EDE7DB}
a{color:#B98457}a:hover{color:#CD9A6C}
@keyframes rehab-shake{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(1px,2px)}}
@keyframes rehab-throb{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 0 0; display: flex; flex-direction: column; color: #EDE7DB; font-family: 'Chivo', system-ui, sans-serif; background: {{bg}}; transition: background 120ms linear; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; animation: {{shake}};">

<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 28px;">
<div style="font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: #A0978A;">Rehab · blocage · prototype interactif</div>
<div style="font-size: 26px; line-height: 1.2; font-weight: 500;">Nuit · déblocage à 07:30</div>
<div style="font-size: 14px; color: #A0978A;">Plage nocturne du dimanche : 23:00 → 07:30</div>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 40px 28px 0;">
<div style="position: relative; width: 176px; height: 176px; display: flex; align-items: center; justify-content: center;">
<svg width="176" height="176" viewBox="0 0 176 176" style="position: absolute; inset: 0;">
<circle cx="88" cy="88" r="80" fill="none" stroke="#B98457" stroke-width="10" style="opacity: {{ringOpacity}}; transition: opacity 120ms linear;"></circle>
<circle cx="88" cy="88" r="80" fill="none" stroke="#E4614F" stroke-width="10" stroke-dasharray="{{crack}}" transform="rotate(-90 88 88)" style="opacity: {{crackOpacity}};"></circle>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative;">
<div style="font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #B98457; font-weight: 700; opacity: {{ringOpacity}};">Record</div>
<div style="font-family: 'Chivo Mono', monospace; font-size: 64px; line-height: 1; font-weight: 300; color: {{daysColor}};">{{days}}</div>
<div style="font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: #A0978A;">jours</div>
</div>
</div>
<div style="font-size: 13px; color: #A0978A; text-align: center; min-height: 20px;">{{streakLine}}</div>
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 0 28px 0;">
<button aria-label="Maintenir pour débloquer" onPointerDown="{{down}}" onPointerUp="{{up}}" onPointerLeave="{{up}}" onPointerCancel="{{up}}" onContextMenu="{{noop}}" style="width: 96px; height: 96px; border-radius: 50%; border: 0; background: {{btnBg}}; padding: 0; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; transform: scale({{btnScale}}); transition: transform 80ms linear, background 120ms linear; animation: {{throb}};">
<svg width="96" height="96" viewBox="0 0 96 96" style="position: absolute; inset: 0;"><circle cx="48" cy="48" r="40" fill="none" stroke="#9A3A30" stroke-width="8"></circle><circle cx="48" cy="48" r="40" fill="none" stroke="#E4614F" stroke-width="8" stroke-dasharray="{{dash}}" transform="rotate(-90 48 48)"></circle></svg>
<span style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;"><span style="font-family: {{btnFontFamily}}; font-size: {{btnFont}}px; letter-spacing: {{btnSpacing}}; text-transform: uppercase; line-height: 1; color: {{btnTxt}};">{{btnLabel}}</span><span style="font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: {{btnSub}};">{{btnSubLabel}}</span></span>
</button>
<div style="height: 40px; width: 300px; display: flex; align-items: center; justify-content: center; font-size: 13px; text-align: center; line-height: 1.5; color: #E4614F; transform: scale({{capScale}}); transition: transform 120ms linear; font-weight: {{capWeight}};">{{caption}}</div>
</div>

<div style="padding: 26px 20px 16px; display: flex; flex-direction: column; gap: 10px;">
<button style="width: 100%; height: 60px; border: 0; background: #EDE7DB; color: #171513; font-family: 'Chivo', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; border-radius: 18px; cursor: pointer;">Quitter</button>
<button onClick="{{reset}}" style="height: 36px; border: 0; background: transparent; color: #A0978A; font-family: 'Chivo', sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;">Réinitialiser la démo</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"holdSeconds":{"editor":"range","default":10,"min":3,"max":15,"step":1,"unit":"s","section":"Comportement"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { p: 0, holding: false, done: false };
this.timer = null;
this.startedAt = 0;
}
componentWillUnmount() { this.stop(); }
stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } }
lerp(a, b, t) { return Math.round(a + (b - a) * t); }
hex(r, g, b) { return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join(''); }
renderVals() {
const dur = (this.props.holdSeconds ?? 10) * 1000;
const s = this.state;
const p = s.done ? 1 : s.p;
const down = (e) => {
if (s.done) return;
if (e && e.preventDefault) e.preventDefault();
this.startedAt = Date.now();
this.stop();
this.setState({ holding: true, p: 0 });
this.timer = setInterval(() => {
const q = Math.min(1, (Date.now() - this.startedAt) / dur);
if (q >= 1) { this.stop(); this.setState({ p: 1, holding: false, done: true }); }
else this.setState({ p: q });
}, 40);
};
const up = () => { if (!this.state.holding) return; this.stop(); this.setState({ holding: false, p: 0 }); };
const reset = () => { this.stop(); this.setState({ p: 0, holding: false, done: false }); };
const noop = (e) => { if (e && e.preventDefault) e.preventDefault(); };
const C = 2 * Math.PI * 40;
const dash = (C * p).toFixed(1) + ' ' + C.toFixed(1);
const bg = this.hex(this.lerp(0x17, 0x5A, p), this.lerp(0x15, 0x1A, p), this.lerp(0x13, 0x15, p));
const days = Math.max(0, Math.round(24 * (1 - p)));
const bigC = 2 * Math.PI * 80;
const shake = p > 0.6 && s.holding ? 'rehab-shake ' + (0.14 - (p - 0.6) * 0.2).toFixed(2) + 's infinite' : 'none';
const throb = s.holding && p > 0.3 ? 'rehab-throb ' + (0.9 - p * 0.5).toFixed(2) + 's infinite' : 'none';
let caption, btnLabel, btnSubLabel, streakLine;
if (s.done) {
caption = 'Relapse enregistré · déblocage 15 min';
btnLabel = '+15'; btnSubLabel = 'min';
streakLine = 'Série remise à zéro · record 24 conservé';
} else if (s.holding) {
const left = Math.ceil((1 - p) * dur / 1000);
caption = 'Encore ' + left + ' s et ton streak de 24 jours tombe';
btnLabel = String(left); btnSubLabel = 'sec';
streakLine = p > 0.5 ? 'Tu es en train de le perdre.' : 'Record en cours depuis 1 jour';
} else {
caption = 'Maintenir ' + (this.props.holdSeconds ?? 10) + ' s · RELAPSE · ton streak de 24 jours tombe';
btnLabel = 'Relapse'; btnSubLabel = '';
streakLine = 'Record en cours depuis 1 jour';
}
return {
down, up, reset, noop, dash, bg, shake, throb,
days: String(days),
daysColor: p > 0.5 ? '#E4614F' : '#EDE7DB',
ringOpacity: (1 - p).toFixed(2),
crack: (bigC * p).toFixed(1) + ' ' + bigC.toFixed(1),
crackOpacity: p > 0 ? '0.9' : '0',
btnBg: s.done ? '#E4614F' : '#6B211B',
btnTxt: s.done ? '#171513' : '#F6E4E0',
btnSub: s.done ? '#171513' : '#D9A9A2',
btnLabel, btnSubLabel,
btnFont: btnLabel === 'Relapse' ? '12' : '22',
btnFontFamily: btnLabel === 'Relapse' ? "'Chivo', system-ui, sans-serif" : "'Chivo Mono', monospace",
btnSpacing: btnLabel === 'Relapse' ? '0.08em' : '0',
btnScale: (1 + p * 0.18).toFixed(3),
caption, capScale: (1 + p * 0.12).toFixed(3), capWeight: p > 0.5 ? '700' : '400',
streakLine
};
}
}
</script>
</body>
</html>
